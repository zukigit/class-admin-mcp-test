[package]
name = "class-admin"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "MCP server for browsing and booking classes, with admin management"

[dependencies]
rmcp = { version = "3.10", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["timeout", "trace"] }
http = "1"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
email_address = "0.2"
uuid = { version = "1", features = ["v4"] }
governor = "0.10"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
