schema_version = 4

# Shared ZeroClaw settings: tools, gateway.
# install.sh uses this only when the --data dir has no
# .zeroclaw/config.toml yet.
#
# No credentials here. Supply the provider API key at runtime, e.g. in
# docker-compose.yml:
#   - ZEROCLAW_providers__models__opencode__deepseek_flash__api_key=${PROVIDER_API_KEY:-}
# with PROVIDER_API_KEY in .env (gitignored).

[tools]
optional = ["*"]

# Risk and runtime profiles live in the kit (risk_profiles/, runtime_profiles/)
# and are added by install.sh.

# Model providers live in the kit (providers/) and are added by install.sh.

[gateway]

[agents]
