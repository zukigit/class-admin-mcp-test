# Model provider. The folder name is the provider's name, written
# `<provider>.<profile>`: <provider> is a ZeroClaw provider id (e.g. opencode)
# and <profile> is any label you choose (e.g. deepseek_flash).
# `[provider]` becomes `[providers.models.<provider>.<profile>]` in ZeroClaw's
# config.toml. Agents select it with `model_provider = "<provider>.<profile>"`.
#
# NEVER put api_key here. Supply it at runtime: add this line to the
# zeroclaw service's environment in docker-compose.yml
#   - ZEROCLAW_providers__models__{{NAME_ENV}}__api_key=${{{KEY_VAR}}:?set {{KEY_VAR}} in .env}
# and put {{KEY_VAR}}=<key> in .env (gitignored). All profiles of the same
# provider share that variable. Or enter the key in the dashboard instead.

[provider]
model = "deepseek-v4.1-flash"
